    // Savollarni aralashtirish funksiyasi
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    // Javob variantlarini aralashtirish
    function shuffleAnswers(quiz) {
        quiz.forEach(item => {
            const answersArray = Object.entries(item.answers);
            shuffle(answersArray);
            item.answers = Object.fromEntries(answersArray);
            item.correct = answersArray.find(([key, value]) => value === item.answers[item.correct])[0]; // To'g'ri javobni yangilash
        });
    }
    // Savollarni aralashtiramiz
    // shuffle(quizData);

    shuffleAnswers(quizData);



    const quizContainer = document.getElementById('quiz');
    const submitButton = document.getElementById('submit');
    const resultsContainer = document.getElementById('results');
    const finalResultsContainer = document.getElementById('finalResults');
    const numberPagination = document.getElementById('numberPagination');
    const timerDisplay = document.getElementById('timer');
    const prevButton = document.getElementById('prevButton');
    const nextButton = document.getElementById('nextButton');

    let totalQuestions = quizData.length;
    const timePerQuestion = 48; // 48 soniya
    let timeLeft = totalQuestions * timePerQuestion;
    let currentQuestionIndex = 0;

    const selectedAnswers = Array(totalQuestions).fill(null);

    function startTimer() {
        const timerInterval = setInterval(() => {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `Vaqt: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert("Vaqt tugadi!");
                submitButton.click();
            }
            timeLeft--;
        }, 1000);
    }

    function loadQuestion() {
        const item = quizData[currentQuestionIndex];
        quizContainer.innerHTML = `
            <div class="question">
                <p>${currentQuestionIndex + 1}. ${item.question}</p>
                ${Object.keys(item.answers).map(letter => {
            const isChecked = selectedAnswers[currentQuestionIndex] === letter ? 'checked' : '';
            const bgColor = selectedAnswers[currentQuestionIndex] === letter ? (letter === item.correct ? 'lightgreen' : 'lightcoral') : '#ccf3ff';
            return `
                        <label class="answer" id="answer${letter}" style="background-color: ${bgColor};">
<input type="checkbox" name="question${currentQuestionIndex}" value="${letter}" ${isChecked} onchange="updateAnswer('${letter}')">${item.answers[letter]}
                        </label>
                    `;
        }).join('')}
                <div class="result" id="result${currentQuestionIndex}">${getPreviousResult(currentQuestionIndex)}</div>
            </div>
        `;
        updateNumberPagination();
        updateNavigationButtons();
    }

    function updateNavigationButtons() {
        prevButton.style.display = currentQuestionIndex === 0 ? 'none' : 'inline-block';
        nextButton.style.display = currentQuestionIndex === totalQuestions - 1 ? 'none' : 'inline-block';
    }

    function updateAnswer(selected) {
        const answers = document.querySelectorAll(`input[name="question${currentQuestionIndex}"]`);
        answers.forEach(answer => {
            const label = document.getElementById(`answer${answer.value}`);
            if (answer.value === selected) {
                answer.checked = true;
                selectedAnswers[currentQuestionIndex] = selected;
                label.style.backgroundColor = selected === quizData[currentQuestionIndex].correct ? 'lightgreen' : 'lightcoral';
                showResult(selected);
            } else {
                label.style.backgroundColor = '#ccf3ff';
                answer.checked = false;
            }
        });
        updateNumberPagination();
    }

    function showResult(selected) {
        const item = quizData[currentQuestionIndex];
        const resultElement = document.getElementById(`result${currentQuestionIndex}`);
        if (selected === item.correct) {
            resultElement.innerHTML = `<span class="correct">Javob to'g'ri tanlangan!</span>`;
        } else {
            resultElement.innerHTML = `<span class="incorrect">Javob noto'g'ri tanlangan! To'g'ri javob: ${item.answers[item.correct]}</span>`;
        }
    }

    function getPreviousResult(index) {
        if (selectedAnswers[index] === null) return '';
        const selectedAnswer = selectedAnswers[index];
        const item = quizData[index];
        if (selectedAnswer === item.correct) {
            return `<span class="correct">Javob to'g'ri tanlangan!</span>`;
        } else {
            return `<span class="incorrect">Javob noto'g'ri tanlangan! To'g'ri javob: ${item.answers[item.correct]}</span>`;
        }
    }

    function updateNumberPagination() {
        numberPagination.innerHTML = '';
        quizData.forEach((_, index) => {
            const button = document.createElement('button');
            button.textContent = index + 1;
            button.className = selectedAnswers[index] === quizData[index].correct ? 'answered-correct' : selectedAnswers[index] === null ? 'unanswered' : 'answered-incorrect';
            button.onclick = () => goToQuestion(index);
            numberPagination.appendChild(button);
        });
    }

    function goToQuestion(index) {
        currentQuestionIndex = index;
        loadQuestion();
    }

    function getResults() {
        resultsContainer.innerHTML = '';
        let correctCount = 0;
        quizData.forEach((item, index) => {
            if (selectedAnswers[index] === item.correct) {
                correctCount++;
                resultsContainer.innerHTML += `<div class="result" style="color: green">Savol ${index + 1}: <span class="correct">To'g'ri javob: ${item.answers[item.correct]}</span></div>`;
            } else if (selectedAnswers[index] === null) {
                resultsContainer.innerHTML += `<div class="result" style="color:blue">Savol ${index + 1}: <span class="incorrect">Javob berilmagan! To'g'ri javob: ${item.answers[item.correct]}</span></div>`;
            } else {
                resultsContainer.innerHTML += `<div class="result" style="color:red">Savol ${index + 1}: <span class="incorrect">Noto'g'ri! To'g'ri javob: ${item.answers[item.correct]} (Siz: ${item.answers[selectedAnswers[index]]})</span></div>`;
            }
        });
        finalResultsContainer.innerHTML = `<h2>Umumiy natija: ${correctCount} / ${totalQuestions}</h2>`;
        resultsContainer.style.display = 'block';
        finalResultsContainer.style.display = 'block';
    }

    submitButton.addEventListener('click', getResults);
    prevButton.addEventListener('click', () => {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            loadQuestion();
        }
    });

    nextButton.addEventListener('click', () => {
        if (currentQuestionIndex < totalQuestions - 1) {
            currentQuestionIndex++;
            loadQuestion();
        }
    });

    loadQuestion();
    startTimer();
</script>
