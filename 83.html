    // Savollarni aralashtirish funksiyasi
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    // Javob variantlarini aralashtirish
    function shuffleAnswers(quiz) {
        quiz.forEach(item => {
            const answersArray = Object.entries(item.answers);
            shuffle(answersArray);
            item.answers = Object.fromEntries(answersArray);
            item.correct = answersArray.find(([key, value]) => value === item.answers[item.correct])[0]; // To'g'ri javobni yangilash
        });
    }
    const _orig=JSON.parse(JSON.stringify(quizData));
    function setMode(mode){
        var r=mode==="random";
        var on="padding:7px 16px;border:none;border-radius:6px;cursor:pointer;background:#3a7bd5;color:white;font-size:14px";
        var off="padding:7px 16px;border:none;border-radius:6px;cursor:pointer;background:#e0e0e0;color:#333;font-size:14px";
        document.getElementById("btn-random").style.cssText=r?on:off;
        document.getElementById("btn-ordered").style.cssText=r?off:on;
        for(var i=0;i<quizData.length;i++)quizData[i]=JSON.parse(JSON.stringify(_orig[i]));
        if(r)shuffle(quizData); shuffleAnswers(quizData); loadQuestion();
    }

    const quizContainer = document.getElementById('quiz');
    const submitButton = document.getElementById('submit');
    const resultsContainer = document.getElementById('results');
    const finalResultsContainer = document.getElementById('finalResults');
    const numberPagination = document.getElementById('numberPagination');
    const timerDisplay = document.getElementById('timer');
    const prevButton = document.getElementById('prevButton');
    const nextButton = document.getElementById('nextButton');

    let totalQuestions = quizData.length;
    const timePerQuestion = 48; // 6 soniya
    let timeLeft = totalQuestions * timePerQuestion;
    let currentQuestionIndex = 0;

    const selectedAnswers = Array(totalQuestions).fill(null);

    function startTimer() {
        const timerInterval = setInterval(() => {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `Vaqt: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert("Vaqt tugadi!");
                submitButton.click();
            }
            timeLeft--;
        }, 1000);
    }

    function loadQuestion() {
        const item = quizData[currentQuestionIndex];
        quizContainer.innerHTML = `
            <div class="question">
                <p>${currentQuestionIndex + 1}. ${item.question}</p>
                ${Object.keys(item.answers).map(letter => {
            const isChecked = selectedAnswers[currentQuestionIndex] === letter ? 'checked' : '';
            const bgColor = selectedAnswers[currentQuestionIndex] === letter ? 'lightblue' : '#ccf3ff';
            return `
                        <label class="answer" id="answer${letter}" style="background-color: ${bgColor};">
                            <input type="checkbox" name="question${currentQuestionIndex}" value="${letter}" ${isChecked} onchange="updateAnswer('${letter}')">
                           ${item.answers[letter]}
                        </label>
                    `;
        }).join('')}
            </div>
        `;
        updateNumberPagination();
        updateNavigationButtons();
    }

    function updateNavigationButtons() {
        prevButton.style.display = currentQuestionIndex === 0 ? 'none' : 'inline-block';
        nextButton.style.display = currentQuestionIndex === totalQuestions - 1 ? 'none' : 'inline-block';
    }

    function updateAnswer(selected) {
        selectedAnswers[currentQuestionIndex] = selected;
        loadQuestion(); // Savolni yangilash
        updateNumberPagination();
    }

    function updateNumberPagination() {
        numberPagination.innerHTML = '';
        quizData.forEach((_, index) => {
            const button = document.createElement('button');
            button.textContent = index + 1;
            button.className = selectedAnswers[index] === null ? '' : selectedAnswers[index] === quizData[index].correct ? 'answered-correct' : 'answered-incorrect';
            button.style.backgroundColor = selectedAnswers[index] === null ? 'white' : 'lightblue';
            button.onclick = () => goToQuestion(index);
            numberPagination.appendChild(button);
        });
    }

    function goToQuestion(index) {
        currentQuestionIndex = index;
        loadQuestion();
    }

    function getResults() {
        resultsContainer.innerHTML = '';
        let correctCount = 0;
        quizData.forEach((item, index) => {
            if (selectedAnswers[index] === item.correct) {
                correctCount++;
                resultsContainer.innerHTML += `<div class="result">Savol ${index + 1}: <span class="correct">To'g'ri javob: ${item.answers[item.correct]}</span></div>`;
            } else if (selectedAnswers[index] === null) {
                resultsContainer.innerHTML += `<div class="result">Savol ${index + 1}: <span class="incorrect">Javob berilmagan! To'g'ri javob: ${item.answers[item.correct]}</span></div>`;
            } else {
                resultsContainer.innerHTML += `<div class="result">Savol ${index + 1}: <span class="incorrect">Noto'g'ri! To'g'ri javob: ${item.answers[item.correct]} (Siz: ${item.answers[selectedAnswers[index]]})</span></div>`;
            }
        });
        finalResultsContainer.innerHTML = `<h2>Umumiy natija: ${correctCount} / ${totalQuestions}</h2>`;
        resultsContainer.style.display = 'block';
        finalResultsContainer.style.display = 'block';
        updatePaginationResults();
    }

    function updatePaginationResults() {
        numberPagination.querySelectorAll('button').forEach((button, index) => {
            button.style.backgroundColor = selectedAnswers[index] === quizData[index].correct ? 'lightgreen' : 'lightcoral';
        });
    }

    submitButton.addEventListener('click', getResults);
    prevButton.addEventListener('click', () => {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            loadQuestion();
        }
    });

    nextButton.addEventListener('click', () => {
        if (currentQuestionIndex < totalQuestions - 1) {
            currentQuestionIndex++;
            loadQuestion();
        }
    });

    setMode("ordered");
    startTimer();
</script>
